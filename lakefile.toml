name = "LeanUtils"
version = "0.1.0"
defaultTargets = ["KernelCheck", "ExtractSorry"]
testDriver = "LeanUtilsTest"

[[lean_lib]]
name = "LeanUtils"

# The executables' root modules, as a library so that tests can import them
# (`import bins.ExtractSorry`) and Lake knows how to build them on demand.
[[lean_lib]]
name = "bins"

[[lean_exe]]
name = "KernelCheck"
root = "bins.KernelCheck"

[[lean_exe]]
name = "ExtractSorry"
root = "bins.ExtractSorry"
supportInterpreter = true

# `#guard_msgs` golden tests plus their fixture files.  Building the fixtures is
# what makes `findOLean` resolve their module names when a test re-elaborates them.
[[lean_lib]]
name = "LeanUtilsTest"
globs = ["LeanUtilsTest.+"]
